
name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

      - name: Instalar Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Verificar projeto
        run: |
          test -f project.godot || (echo "ERRO: project.godot não encontrado na raiz do repositório" && exit 1)

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --quit
          echo "O projeto foi verificado. Para exportar o APK, o projeto precisa ter um preset Android configurado e os templates de exportação instalados."

      - name: Guardar arquivos de build
        uses: actions/upload-artifact@v4
        with:
          name: arquivos-android
          path: build/
          if-no-files-found: warn
          
